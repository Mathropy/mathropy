{% assign document = post | default: page %}

{% if document.status %}
  <div class="puzzle-meta" aria-label="Puzzle status">
    <span class="puzzle-status puzzle-status--{{ document.status | slugify }}">
      {{ document.status | replace: "-", " " | upcase }}
    </span>
  </div>
{% endif %}
